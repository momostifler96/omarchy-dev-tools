# Omarchy Dev Tools — raccourci clavier Hyprland
# Ce fichier est copié par bin/install.sh dans ~/.config/hypr/plugins/
# et sourcé depuis hyprland.conf (source = ~/.config/hypr/plugins/*.conf).

bind = SUPER, T, exec, omarchy-dev-tools

# Règle de fenêtre : lance l'app flottante et centrée, taille fixe.
windowrulev2 = float, class:^(omarchy-dev-tools)$
windowrulev2 = center, class:^(omarchy-dev-tools)$
windowrulev2 = size 1000 680, class:^(omarchy-dev-tools)$
